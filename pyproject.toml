[project]
name = "job-application-agent"
version = "0.1.0"
description = "招聘通知与申请进度管理 Agent：从通知核对到申请、待办与变更记录"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.30.0",
    "openai>=1.66.0",
    "cryptography>=46.0.0",
]

[project.optional-dependencies]
agent = [
    "openai-agents>=0.0.16",
    "openai>=1.66.0",
    "cryptography>=46.0.0",
    "redis[hiredis]>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "database*", "agent*", "services*", "schemas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
